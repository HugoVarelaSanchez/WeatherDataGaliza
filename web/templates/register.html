<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Crear cuenta</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form id="register-form" method="POST" action="/register">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre de usuario</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="phone">Teléfono (opcional)</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div class="form-group">
                <label for="contrasenha">Contraseña</label>
                <input type="password" id="contrasenha" name="contrasenha" required>
            </div>
            <div class="form-group">
                <label for="contrasenha_confirm">Confirmar contraseña</label>
                <input type="password" id="contrasenha_confirm" name="contrasenha_confirm" required>
            </div>
            <button type="submit">Registrarse</button>
        </form>

        <div class="link">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
