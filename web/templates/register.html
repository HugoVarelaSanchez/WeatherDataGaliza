<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta en HackUDC 2026 — Tu plataforma de hackathon">
    <title>Crear cuenta — HackUDC 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card" id="auth-card">

            <!-- Brand -->
            <div class="auth-brand">
                <div class="auth-brand-icon">
                    <svg viewBox="0 0 24 24">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                    </svg>
                </div>
                <div class="auth-brand-name">Hack<span>UDC</span> 2026</div>
            </div>

            <h1 class="auth-title">Crea tu cuenta</h1>
            <p class="auth-subtitle">Únete al hackathon más grande de Galicia</p>

            <!-- Error Alert -->
            {% if error %}
            <div class="alert alert-error" id="error-alert">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/register" id="register-form" novalidate>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                        </div>
                        <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com"
                            required autocomplete="email">
                    </div>
                </div>

                <!-- Nombre -->
                <div class="form-group">
                    <label class="form-label" for="nombre">Nombre de usuario</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </div>
                        <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Tu nombre" required
                            autocomplete="name">
                    </div>
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <label class="form-label" for="phone">Teléfono <span
                            style="color:var(--txt-muted);font-weight:400;text-transform:none;letter-spacing:0">(opcional)</span></label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.89 12 19.79 19.79 0 0 1 1.83 3.5 2 2 0 0 1 3.8 1.3h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
                            </svg>
                        </div>
                        <input type="tel" id="phone" name="phone" class="form-input" placeholder="+34 600 000 000"
                            autocomplete="tel">
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label class="form-label" for="contrasenha">Contraseña</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </div>
                        <input type="password" id="contrasenha" name="contrasenha" class="form-input"
                            placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
                        <button type="button" class="input-toggle" id="toggle-pwd" aria-label="Mostrar contraseña">
                            <svg id="eye-pwd" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength" id="pwd-strength">
                        <div class="strength-bar-track">
                            <div class="strength-bar" id="strength-bar"></div>
                        </div>
                        <span class="strength-label" id="strength-label">Contraseña débil</span>
                    </div>
                </div>

                <!-- Confirmar contraseña -->
                <div class="form-group">
                    <label class="form-label" for="contrasenha_confirm">Confirmar contraseña</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <polyline points="9 11 12 14 22 4" />
                                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                            </svg>
                        </div>
                        <input type="password" id="contrasenha_confirm" name="contrasenha_confirm" class="form-input"
                            placeholder="Repite la contraseña" required autocomplete="new-password">
                    </div>
                    <div id="match-alert" class="alert alert-error"
                        style="display:none;margin-top:10px;margin-bottom:0">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="15" y1="9" x2="9" y2="15" />
                            <line x1="9" y1="9" x2="15" y2="15" />
                        </svg>
                        Las contraseñas no coinciden
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">Crear cuenta</button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
            </div>

        </div>
    </div>

    <div id="toast-container"></div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        {% if error %}
        document.getElementById('auth-card').classList.add('shake');
        {% endif %}

        // Password strength meter
        const pwdInput = document.getElementById('contrasenha');
        const strengthEl = document.getElementById('pwd-strength');
        const strengthBar = document.getElementById('strength-bar');
        const strengthLbl = document.getElementById('strength-label');

        pwdInput.addEventListener('input', () => {
            const val = pwdInput.value;
            if (!val) { strengthEl.classList.remove('visible'); return; }
            strengthEl.classList.add('visible');

            let score = 0;
            if (val.length >= 8) score++;
            if (val.length >= 12) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = [
                { pct: '20%', color: '#f87171', label: 'Muy débil' },
                { pct: '40%', color: '#fb923c', label: 'Débil' },
                { pct: '60%', color: '#fbbf24', label: 'Aceptable' },
                { pct: '80%', color: '#34d399', label: 'Fuerte' },
                { pct: '100%', color: '#6366f1', label: 'Excelente' },
            ];
            const lvl = levels[Math.min(score - 1, 4)] || levels[0];
            strengthBar.style.width = lvl.pct;
            strengthBar.style.background = lvl.color;
            strengthLbl.textContent = lvl.label;
            strengthLbl.style.color = lvl.color;
        });

        // Password toggle
        const toggleBtn = document.getElementById('toggle-pwd');
        const eyeIcon = document.getElementById('eye-pwd');
        toggleBtn.addEventListener('click', () => {
            const isHidden = pwdInput.type === 'password';
            pwdInput.type = isHidden ? 'text' : 'password';
            eyeIcon.innerHTML = isHidden
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });

        // Real-time password match validation
        const confirmInput = document.getElementById('contrasenha_confirm');
        const matchAlert = document.getElementById('match-alert');
        confirmInput.addEventListener('input', () => {
            if (!confirmInput.value) { matchAlert.style.display = 'none'; return; }
            matchAlert.style.display = pwdInput.value !== confirmInput.value ? 'flex' : 'none';
        });

        // Form submit
        document.getElementById('register-form').addEventListener('submit', (e) => {
            if (pwdInput.value !== confirmInput.value) {
                e.preventDefault();
                matchAlert.style.display = 'flex';
                document.getElementById('auth-card').classList.remove('shake');
                void document.getElementById('auth-card').offsetWidth;
                document.getElementById('auth-card').classList.add('shake');
                return;
            }
            const btn = document.getElementById('submit-btn');
            btn.textContent = 'Creando cuenta…';
            btn.classList.add('loading');
        });
    </script>
</body>

</html>
